      if(typeof saved.design.introAnimation==='boolean') design.introAnimation=saved.design.introAnimation;
      for(const [key,min,max] of [['band',180,250],['radius',6,20],['gutter',16,24],['welcomeSize',44,60]]) if(Number.isFinite(saved.design[key])) design[key]=Math.min(max,Math.max(min,saved.design[key]));
    }
  }
  function persist() {
    if(window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{onboardingWireframes:{screen:screenControl.options[state.screen]?.text,preview:state.scene,design:{...design}}},privateContent:{version:5,screen:state.screen,scene:state.scene,design:{...design}}}).catch(()=>{});
  }
  function applyDesign() {
    product.dataset.fidelity=design.fidelity;
    product.style.colorScheme=design.theme==='system'?'light dark':design.theme;
    product.style.setProperty('--halo-band',`${design.band}px`);
    product.style.setProperty('--halo-radius',`${design.radius}px`);
    product.style.setProperty('--halo-gutter',`${design.gutter}px`);
    product.style.setProperty('--halo-welcome-size',`${design.welcomeSize}px`);
    product.dataset.introMotion=design.introAnimation?'on':'off';
    drawWelcomeHeading();
  }
  function refreshIcons() { if(globalThis.lucide) globalThis.lucide.createIcons({attrs:{width:18,height:18,'stroke-width':1.8}}); }
  function clearTimers() { clearTimeout(timer); clearInterval(revealTimer); timer=null; revealTimer=null; state.busy=false; }
  function nav(step) {
    return `<div class="halo-top"><div class="halo-progress" role="img" aria-label="Step ${step+1} of 4">${[0,1,2,3].map(i=>`<span data-filled="${i<=step}"></span>`).join('')}</div><button type="button" class="halo-back cursor-interaction" data-action="back" aria-label="Back">${icon('arrow-left')}</button></div>`;
  }
  function errorText(message,id) { return `<div class="halo-error" id="${id}"${message?' role="alert"':''}>${message?`${icon('circle-alert')}<span>${escape(message)}</span>`:''}</div>`; }
  function requestError(message,retry=true) { return `<div class="halo-callout" role="alert"><div class="halo-callout-title">${icon('circle-alert')}<p>${escape(message)}</p></div>${retry?'<button type="button" class="halo-text-button cursor-interaction" data-action="retry">Retry</button>':''}</div>`; }
  function button(label,action,variant='primary',disabled=false,busy=false) { return `<button type="button" class="halo-button halo-${variant} cursor-interaction" data-action="${action}" ${disabled?'disabled':''} ${busy?'aria-busy="true"':''} aria-label="${escape(label)}">${busy?'<span class="halo-spinner" aria-hidden="true"></span><span class="halo-sr">Working</span>':escape(label)}</button>`; }
  function welcome() {
    const message=state.scene==='captcha'?'Verification could not be completed. Check your connection and try again.':state.scene==='signin'?'Could not start a session. Please reload and try again.':null;
    const loading=state.scene==='session-loading';
    return `<section class="halo-page" aria-label="Welcome"><div class="halo-band"><div class="halo-logo halo-logo-tile">${logo}</div></div><div class="halo-welcome-copy"><h1 class="halo-wordmark" aria-label="Welcome"><canvas width="882" height="288" aria-hidden="true">Welcome</canvas></h1><h2 class="halo-welcome-subtitle">To Halo</h2><p>See what's in the air, water, and ground around your home, and what to do about it.</p><p class="halo-account-note">No account needed.</p></div><div class="halo-footer">${message?requestError(message,false):''}${button('Get started','next','primary',!!message||loading,loading)}<p class="halo-footer-note">Takes about a minute.</p></div></section>`;
  }
  function address() {
    const busy=state.busy||state.scene==='loading';
    const msg=state.scene==='rate-limited'?"You've made a lot of requests. Please try again later.":state.scene==='timeout'?'That took too long. The data source may be slow right now.':['error','offline'].includes(state.scene)?genericError:null;
    return `<section class="halo-page" aria-label="Address">${state.scene==='offline'?`<div class="halo-offline">${icon('wifi-off')}<span>You're offline.</span></div>`:''}${nav(1)}<div class="halo-main"><h1>Where do you live?</h1><div class="halo-fields"><div class="halo-field"><label class="halo-label" for="halo-address">Address or ZIP code</label><input id="halo-address" class="halo-input" type="text" autocomplete="street-address" placeholder="Street address or ZIP code" value="${escape(state.gps?'Using your current location':state.address)}" aria-invalid="${!!state.addressError}" aria-describedby="halo-address-error halo-privacy" ${busy?'disabled':''}>${errorText(state.addressError,'halo-address-error')}<p class="halo-privacy" id="halo-privacy">We use your address once to find your local data, then throw it away. We keep only your approximate coordinates, your county, and which water utility serves you. We never keep the street address itself.</p></div></div><div class="halo-location">${button('Use my location','location','secondary',busy)}<div class="halo-location-note">${errorText(state.locationError,'halo-location-error')}</div></div></div><div class="halo-footer">${msg?requestError(msg,state.scene!=='rate-limited'):''}${button('Continue','next','primary',busy,busy)}${busy?'<p class="halo-footer-note" role="status">Finding your local data.</p>':''}</div></section>`;
  }
  function household() {
    const busy=state.busy||state.scene==='loading';
    return `<section class="halo-page" aria-label="Household">${nav(2)}<div class="halo-main"><h1>Who lives here?</h1><p class="halo-intro">This lets HALO tell you what today's readings mean for the people in your home. We never ask for ages, birthdays, or names, just which groups apply.</p><fieldset class="halo-chips"><legend class="halo-sr">Which groups apply to your household?</legend>${groups.map(([key,label])=>`<button type="button" class="halo-chip cursor-interaction" data-group="${key}" aria-pressed="${!!state.groups[key]}" ${busy?'disabled':''}><span class="halo-chip-mark">${icon(state.groups[key]?'check':'plus')}</span><span>${label}</span></button>`).join('')}</fieldset></div><div class="halo-footer">${state.scene==='error'?requestError(genericError,false):''}<div class="halo-actions-equal">${button('Skip this','skip','secondary',busy)}${button('Continue','next','secondary',busy,busy)}</div></div></section>`;
  }
  function home() {
    const busy=state.busy||state.scene==='loading';
    return `<section class="halo-page" aria-label="Your home">${nav(3)}<div class="halo-main"><h1>A little about your home.</h1><div class="halo-fields"><div class="halo-field"><label class="halo-label" for="halo-year"><span>Year built</span><span class="halo-optional">Optional</span></label><input id="halo-year" class="halo-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" value="${escape(state.year)}" aria-invalid="${!!state.yearError}" aria-describedby="halo-year-error halo-year-help" ${busy?'disabled':''}>${errorText(state.yearError,'halo-year-error')}<p class="halo-year-help" id="halo-year-help">Homes built before 1988 may have lead solder in their plumbing. If you're not sure, leave it blank. We'll tell you we don't know rather than guess.</p></div><div class="halo-field"><label class="halo-label" for="halo-water">Where does your water come from?</label><select id="halo-water" class="halo-select cursor-interaction" aria-invalid="${!!state.waterError}" aria-describedby="halo-water-error" ${busy?'disabled':''}><option value="">Select a water source</option>${waterOptions.map(x=>`<option${state.water===x?' selected':''}>${x}</option>`).join('')}</select>${errorText(state.waterError,'halo-water-error')}</div></div></div><div class="halo-footer">${state.scene==='error'?requestError(genericError,false):''}${button('See my results','next','primary',busy,busy)}</div></section>`;
  }
  function revealData() {
    const rows=[{label:'Finding your water utility...',result:'Concord, City of'},{label:'Checking federal testing results...',result:'PFOS found above the limit'},{label:'Looking up radon for Cabarrus County...',result:'Zone 3'},{label:"Getting today's air quality...",result:'Good',severity:true}];
    const s=state.scene==='loading'?state.revealScenario:state.scene;
    if(s==='below')rows[1].result='Nothing found above federal limits';
    if(s==='well'||s==='spring') { rows[0].result=s==='well'?'Private well (no utility)':'Spring (no utility)';rows[0].missing=true; rows[1].result="Wells aren't tested by any agency";rows[1].missing=true; }
    if(s==='no-utility') { rows[0].result='No utility matched your address'; rows[1].result='No utility to check'; rows[0].missing=rows[1].missing=true; }
    if(s==='no-results'||s==='lookup-failed') { rows[0].result='Found your water system (NC0112010)';rows[1].result=s==='no-results'?'No published water results yet for your utility.':"Couldn't check right now";rows[1].missing=true; }
    if(s==='unregulated') rows[1].result='Found compounds with no federal limit';
    if(s==='radon-missing') {rows[2].result='Not available for this county';rows[2].missing=true;}
    if(s==='outside') {rows[0].result='No utility matched your address';rows[0].missing=true; rows[1].result='No utility to check';rows[1].missing=true;rows[2].label='Looking up radon for Union County...';rows[2].result='Covers North Carolina only';rows[2].missing=true;}
    if(s==='air-missing') {rows[3].result='No data';rows[3].missing=true;}
    if(s==='air-error'||s==='all-error') {rows[3]={...rows[3],result:"Couldn't check right now",severity:false,missing:true};}
    if(s==='home-error'||s==='all-error') for(let i=0;i<3;i++)rows[i]={...rows[i],result:"Couldn't check right now",missing:true};
    return rows;
  }
  function reveal() {
    const rows=revealData(); const busy=state.scene==='loading'&&state.resolved<4;
    return `<section class="halo-page" aria-label="Results reveal"><div class="halo-reveal-head"><div class="halo-logo halo-reveal-logo">${logo}</div></div><div class="halo-reveal-lines" aria-live="polite">${rows.map((row,i)=>{const pending=busy&&i>=state.resolved;const visible=!busy||i<=state.resolved;return `<div class="halo-reveal-line"${visible?'':' style="visibility:hidden" aria-hidden="true"'}><span class="halo-resolve-icon" data-missing="${!!row.missing}">${pending?'<span class="halo-spinner" aria-hidden="true"></span>':icon(row.missing?'minus':'check')}</span><div class="halo-reveal-label">${escape(row.label)}</div><div class="halo-result">${pending?'<span class="halo-result-skeleton" aria-hidden="true"></span><span class="halo-result-skeleton" aria-hidden="true"></span><span class="halo-sr">Checking</span>':row.severity?`<span class="halo-severity" data-empty="${!!row.missing}">${icon(row.missing?'circle-help':'circle-check')} ${row.result}</span>`:escape(row.result)}</div></div>`;}).join('')}</div>${state.scene==='outside'?`<div class="halo-region-note">${icon('info')}<p>Daily air, UV, and pollen readings work anywhere. Water and radon detail is strongest in North Carolina.</p></div>`:''}<div class="halo-footer">${button('See my results','finish','primary',busy)}</div></section>`;
  }
  function render() {
    screenControl.value=String(state.screen);
    stateControl.innerHTML=screens[state.screen].map(([value,label])=>`<option value="${value}">${label}</option>`).join('');
    stateControl.value=state.scene;
    content.innerHTML=[welcome,address,household,home,reveal][state.screen]();
    previewContext.textContent=state.screen===4?'Sample results · not live readings':state.scene==='default'?'Interactive preview':'State preview';
    reviewStatus.textContent=state.handoff?'Onboarding complete → Today (/today). This preview ends here.':state.scene==='offline'?"Prototype only · “You're offline.” is proposed onboarding copy; no stored readings exist yet.":'Prototype only · location, saves, and results are simulated.';
    applyDesign();refreshIcons();bindFields();
  }
  function addressValidation() {return state.gps||state.address.trim().length>=5?'':blankAddressError;}
  function yearValidation() {
    if(!state.year)return '';
    if(!/^\d{4}$/.test(state.year)||Number(state.year)<1700)return 'Enter a four-digit year, or leave this blank.';
    if(Number(state.year)>currentYear)return "That year hasn't happened yet.";
    return '';
  }
  function fieldError(id,message) {
    const input=root.querySelector(`#halo-${id}`),box=root.querySelector(`#halo-${id}-error`);
    input?.setAttribute('aria-invalid',String(!!message));
    if(box) {box.innerHTML=message?`${icon('circle-alert')}<span>${escape(message)}</span>`:'';if(message)box.setAttribute('role','alert');else box.removeAttribute('role');}
    refreshIcons();
  }
  function bindFields() {
    const addressField=root.querySelector('#halo-address');
    addressField?.addEventListener('input',e=>{state.address=e.target.value;state.gps=false;if(state.addressError&&!addressValidation()){state.addressError='';fieldError('address','');}});
    addressField?.addEventListener('blur',()=>{state.addressError=addressValidation();fieldError('address',state.addressError);});
    const yearField=root.querySelector('#halo-year');
    yearField?.addEventListener('input',e=>{state.year=e.target.value.replace(/\D/g,'').slice(0,4);e.target.value=state.year;if(state.yearError&&!yearValidation()){state.yearError='';fieldError('year','');}});
    yearField?.addEventListener('blur',()=>{state.yearError=yearValidation();fieldError('year',state.yearError);});
    const waterField=root.querySelector('#halo-water');
    waterField?.addEventListener('change',e=>{state.water=e.target.value;if(state.water){state.waterError='';fieldError('water','');}});
    waterField?.addEventListener('blur',()=>{state.waterError=state.water?'':'Choose where your water comes from.';fieldError('water',state.waterError);});
  }
  function go(screen,scene='default') {
    clearTimers();state.screen=screen;state.scene=scene;state.addressError='';state.yearError='';state.waterError='';state.locationError='';state.handoff=false;render();persist();
  }
  function simulateNext() {
    if(state.busy)return;
    if(state.screen===0) {go(1);return;}
    if(state.screen===1) {state.addressError=addressValidation();if(state.addressError){render();root.querySelector('#halo-address')?.focus();return;}}
    if(state.screen===3) {state.yearError=yearValidation();state.waterError=state.water?'':'Choose where your water comes from.';if(state.yearError||state.waterError){render();root.querySelector(state.yearError?'#halo-year':'#halo-water')?.focus();return;}}
    state.scene='default';state.busy=true;render();
    timer=setTimeout(()=>{state.busy=false;if(state.screen===3){const result=state.water==='Private well'?'well':state.water==='Spring'?'spring':'default';go(4,result);startReveal(result);}else go(state.screen+1);},550);
  }
  function startReveal(scenario='default') {
    clearTimers();state.revealScenario=scenario;state.scene='loading';state.resolved=0;render();
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){state.resolved=4;state.scene=scenario;render();persist();return;}
    revealTimer=setInterval(()=>{state.resolved++;if(state.resolved===4){clearInterval(revealTimer);revealTimer=null;state.scene=scenario;}render();if(state.resolved===4)persist();},450);
  }
  function setScene(scene) {
    clearTimers();state.scene=scene;state.addressError='';state.yearError='';state.waterError='';state.locationError='';state.handoff=false;
    if(state.screen===1) {
      state.gps=scene==='gps';
      if(scene==='default')state.address='';else if(scene==='invalid'){state.address='28';state.addressError=blankAddressError;}else if(!state.gps)state.address='28025';
      if(scene==='not-found'){state.address='Unrecognized address';state.addressError="We couldn't find that address. Try adding your city or ZIP code.";}
      if(scene==='gps-denied')state.locationError="Couldn't get your location. Please type your address instead.";
      if(scene==='gps-unsupported')state.locationError="This device can't share its location. Please type your address.";
    }
    if(state.screen===2)state.groups=scene==='default'?{}:scene==='all'?Object.fromEntries(groups.map(([key])=>[key,true])):{has_adult:true,has_respiratory:true};
    if(state.screen===3) {
      state.year=scene==='default'||scene==='no-year'?'':'1978';state.water=scene==='default'||scene==='missing-water'?'':'City or town water';
      if(scene==='invalid-year'){state.year='1650';state.yearError=yearValidation();}
      if(scene==='future-year'){state.year=String(currentYear+1);state.yearError=yearValidation();}
      if(scene==='missing-water')state.waterError='Choose where your water comes from.';
    }
    if(state.screen===4)state.resolved=scene==='loading'?1:4;
    render();persist();
  }
  content.addEventListener('click',e=>{
    const chip=e.target.closest('[data-group]');
    if(chip&&!chip.disabled) {const key=chip.dataset.group;state.groups[key]=!state.groups[key];chip.setAttribute('aria-pressed',String(!!state.groups[key]));chip.querySelector('.halo-chip-mark').innerHTML=icon(state.groups[key]?'check':'plus');refreshIcons();return;}
    const target=e.target.closest('[data-action]');if(!target||target.disabled)return;
    if(target.dataset.action==='back')go(Math.max(0,state.screen-1));
    if(target.dataset.action==='next'||target.dataset.action==='retry')simulateNext();
    if(target.dataset.action==='skip')go(3);
    if(target.dataset.action==='location'){state.gps=true;state.address='';state.addressError='';state.locationError='';state.scene='gps';render();persist();}
    if(target.dataset.action==='finish'){state.handoff=true;render();persist();}
  });
  content.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();simulateNext();}});
  screenControl.addEventListener('change',()=>go(Number(screenControl.value)));
  stateControl.addEventListener('change',()=>setScene(stateControl.value));
  reducedMotion.addEventListener('change',drawWelcomeHeading);
  systemAppearance.addEventListener('change',drawWelcomeHeading);
  applySaved(window.openai?.widgetState);
  render();
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){clearTimers();applySaved(event.detail.globals.widgetState);render();}});
  if(globalThis.Tweak) {
    const tweak=new Tweak({container:product,onChange:()=>{applyDesign();persist();}});
    tweak.addSelect(design,'fidelity',{label:'Visual treatment',options:[{label:'Brand foundation',value:'brand'},{label:'Neutral wireframe',value:'wireframe'}]});
    tweak.addSelect(design,'theme',{label:'Preview appearance',options:[{label:'Follow system',value:'system'},{label:'Light',value:'light'},{label:'Dark',value:'dark'}]});
    tweak.addSlider(design,'band',{label:'Welcome band height',min:180,max:250,step:10,unit:'px'});
    tweak.addSlider(design,'welcomeSize',{label:'Welcome heading size',min:44,max:60,unit:'px'});
    tweak.addToggle(design,'introAnimation',{label:'Handwriting animation'});
    tweak.addSlider(design,'gutter',{label:'Page gutters',min:16,max:24,step:2,unit:'px'});
    tweak.addSlider(design,'radius',{label:'Field corner radius',min:6,max:20,step:2,unit:'px'});
  }
})();
</script>
